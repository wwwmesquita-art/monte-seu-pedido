/* Layout: cabeçalho curto, filtros por categoria, lista de produtos em grade, barra fixa com o total no rodapé. */
:root {
  --bg: #F2F6F3;
  --surface: #FFFFFF;
  --fg: #13201A;
  --muted: #5B6B63;
  --line: #D9E3DD;
  --accent: #0B7A53;
  --accent-fg: #FFFFFF;
  --accent-soft: #DDF1E8;
  --danger: #B3261E;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1612;
    --surface: #16211B;
    --fg: #E8F1EC;
    --muted: #96A89E;
    --line: #26352D;
    --accent: #3CC28C;
    --accent-fg: #07130D;
    --accent-soft: #19382B;
    --danger: #F2B8B5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1612;
  --surface: #16211B;
  --fg: #E8F1EC;
  --muted: #96A89E;
  --line: #26352D;
  --accent: #3CC28C;
  --accent-fg: #07130D;
  --accent-soft: #19382B;
  --danger: #F2B8B5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 24px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.9rem, 6vw, 2.6rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin: 0 0 6px;
  text-wrap: balance;
}
.sub { color: var(--muted); margin: 0 0 20px; max-width: 46ch; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.chip {
  font: inherit; font-weight: 500; font-size: 0.95rem;
  padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: center;
}
.card.has-qty { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; margin: 0; }

.price {
  font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
  font-variant-numeric: tabular-nums; white-space: nowrap;
  grid-column: 2; grid-row: 1;
  text-align: right;
}
.ctrl { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 8px; }

button { font: inherit; color: inherit; }
button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.add {
  background: var(--accent-soft); color: var(--accent);

}

.small { padding: 8px 14px; font-size: 0.92rem; white-space: nowrap; }

.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: 88%;
  overflow-y: auto; border-radius: 18px 18px 0 0;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
}
.sheet h3 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 12px; }
.lines { list-style: none; margin: 0 0 12px; padding: 0; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lines .n { font-weight: 500; }
.lines .q { color: var(--muted); font-size: 0.88rem; }
.lines .s { font-weight: 700; font-variant-numeric: tabular-nums; grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.sum { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin: 6px 0 16px; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1 1 140px; }
.empty { color: var(--muted); padding: 12px 0; }

/* Editor de produtos */
.hint { color: var(--muted); font-size: 0.9rem; margin: -6px 0 14px; }
.erow {
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 120px); gap: 8px;
}
.erow label { display: grid; gap: 3px; font-size: 0.78rem; color: var(--muted); min-width: 0; }
.erow .full { grid-column: 1 / -1; }
.erow input {
  font: inherit; font-size: 1rem; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
.erow .del {
  grid-column: 1 / -1; justify-self: end; background: transparent; border: 0;
  color: var(--danger); font-weight: 500; cursor: pointer; padding: 4px 2px;
}
.msg { min-height: 1.4em; margin: 8px 0 0; font-size: 0.92rem; color: var(--danger); }
.stick { position: sticky; bottom: -1px; background: var(--surface); padding-top: 12px; margin-top: 6px; }
/* Foto do produto */
.card.with-img { grid-template-columns: 72px minmax(0, 1fr) auto; column-gap: 12px; }

.card.with-img .desc { grid-column: 2; grid-row: 2; }
.card.with-img .ctrl { grid-row: 3; }
.photo { display: flex; gap: 12px; align-items: center; }
.ph { width: 64px; height: 64px; flex: none; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; font-size: 0.72rem; color: var(--muted); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pctl { display: grid; gap: 4px; min-width: 0; flex: 1; }
.erow input[type="file"] { padding: 6px; font-size: 0.85rem; }
.rmimg { background: transparent; border: 0; color: var(--danger); justify-self: start; padding: 0; font-size: 0.88rem; cursor: pointer; }
.pmsg { font-size: 0.8rem; color: var(--muted); }
.pixset { margin-top: 16px; }
.pixset h4 { grid-column: 1 / -1; margin: 0; font-family: var(--font-display); font-size: 1.05rem; }
.pixset .hint { grid-column: 1 / -1; margin: 0; }

/* Pix */
.pix { border-top: 1px solid var(--line); padding-top: 16px; margin-bottom: 16px; display: grid; justify-items: center; gap: 10px; text-align: center; }
.pix h4 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; justify-self: start; }
.qr { width: min(240px, 100%); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; line-height: 0; }

.pix-val { margin: 0; font-size: 0.95rem; }
.pix-code {
  width: 100%; font: 0.78rem/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: none;
}
.pix .primary { width: 100%; }
.pix-help { margin: 0; color: var(--muted); font-size: 0.85rem; }

    setTimeout(function () { btn.textContent = "Copiar código Pix"; }, 2500);
  };
  try {
    navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { done(false); });
  } catch (err) { done(false); }
});

function openSheet() { renderSheet(); $("back").hidden = false; $("close").focus(); }
function closeSheet() { $("back").hidden = true; $("open").focus(); }

function orderText() {
  var lines = items().map(function (p) { return qty[p.id] + "x " + p.name + " - " + money(p.price * qty[p.id]); });
  return "Meu pedido:\n" + lines.join("\n") + "\nTotal: " + money(totalCents());
}

$("open").addEventListener("click", openSheet);
$("close").addEventListener("click", closeSheet);
$("back").addEventListener("click", function (e) { if (e.target === $("back")) closeSheet(); });
$("clear").addEventListener("click", function () { qty = {}; renderGrid(); renderTotals(); closeSheet(); });
$("copy").addEventListener("click", function () {
  var btn = $("copy");
  var done = function (ok) {
    btn.textContent = ok ? "Pedido copiado" : "Não foi possível copiar";
    setTimeout(function () { btn.textContent = "Copiar pedido"; }, 2000);
  };
  try {
    navigator.clipboard.writeText(orderText()).then(function () { done(true); }, function () { done(false); });
  } catch (err) { done(false); }
});

/* ---------- Editor de produtos (só para quem pode editar a página) ---------- */
var artifactApi = null;
var draft = [];
var nextId = 1;

function priceToText(c) { return (c / 100).toFixed(2).replace(".", ","); }
function textToCents(t) {
  var s = String(t).replace(/[^0-9,.\-]/g, "");
  if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", ".");
  var v = parseFloat(s);
  return isFinite(v) && v >= 0 ? Math.round(v * 100) : NaN;
}

function resizeImage(file, max) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function () {
      var s = Math.min(1, max / Math.max(im.width, im.height));
      var w = Math.max(1, Math.round(im.width * s)), h = Math.max(1, Math.round(im.height * s));
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      var x = c.getContext("2d");
      x.fillStyle = "#fff";
      x.fillRect(0, 0, w, h);
      x.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { res(c.toDataURL("image/jpeg", 0.8)); } catch (e) { rej(e); }
    };
    im.onerror = function () { URL.revokeObjectURL(url); rej(new Error("img")); };
    im.src = url;
  });
}

function openEditor() {
  draft = PRODUCTS.map(function (p) {
    return { id: p.id, cat: p.cat || "", name: p.name, desc: p.desc || "", price: priceToText(p.price), img: p.img || "" };
  });
  nextId = PRODUCTS.reduce(function (m, p) { return Math.max(m, p.id); }, 0) + 1;
  $("emsg").textContent = "";
  $("e-pix-key").value = PIX.key;
  $("e-pix-name").value = PIX.name;
  $("e-pix-city").value = PIX.city;
  renderEditor();
  $("eback").hidden = false;
}
function closeEditor() { $("eback").hidden = true; $("edit-open").focus(); }

function renderEditor() {
  var box = $("erows");
  box.innerHTML = "";
  draft.forEach(function (d) {
    var row = document.createElement("div");
    row.className = "erow";
    row.innerHTML =
      '<label class="full">Nome<input id="e-name-' + d.id + '" data-k="name" autocomplete="off"></label>' +
      '<label>Categoria<input id="e-cat-' + d.id + '" data-k="cat" autocomplete="off"></label>' +
      '<label>Preço (R$)<input id="e-price-' + d.id + '" data-k="price" inputmode="decimal" autocomplete="off"></label>' +
      '<label class="full">Descrição<input id="e-desc-' + d.id + '" data-k="desc" autocomplete="off"></label>' +
      '<div class="full photo"><div class="ph"></div><div class="pctl">' +
        '<label>Foto do produto<input id="e-img-' + d.id + '" type="file" accept="image/*"></label>' +
        '<button class="rmimg" type="button">Remover foto</button>' +
        '<span class="pmsg" role="status"></span>' +
      '</div></div>' +
      '<button class="del" type="button">Remover produto</button>';
    ["name", "cat", "price", "desc"].forEach(function (k) {
      var inp = row.querySelector('[data-k="' + k + '"]');
      inp.value = d[k];
      inp.addEventListener("input", function () { d[k] = inp.value; });
    });
    var ph = row.querySelector(".ph"), file = row.querySelector('input[type="file"]');
    var rm = row.querySelector(".rmimg"), pm = row.querySelector(".pmsg");
    var paint = function () {
      ph.innerHTML = "";
      if (d.img) {
        var im = document.createElement("img");
        im.src = d.img;
        im.alt = "";
        ph.appendChild(im);
      } else {
        ph.textContent = "Sem foto";
      }
      rm.hidden = !d.img;
    };
    paint();
    file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      pm.textContent = "Processando…";
      resizeImage(f, 480).then(function (u) { d.img = u; pm.textContent = ""; paint(); },
        function () { pm.textContent = "Não consegui ler essa imagem. Tente uma foto JPG ou PNG."; });
      file.value = "";
    });
    rm.addEventListener("click", function () { d.img = ""; paint(); });
    row.querySelector(".del").addEventListener("click", function () {
      draft = draft.filter(function (x) { return x !== d; });
      renderEditor();
    });
    box.appendChild(row);
  });
}

$("eadd").addEventListener("click", function () {
  var last = draft.length ? draft[draft.length - 1].cat : "";
  var id = nextId++;
  draft.push({ id: id, cat: last, name: "", desc: "", price: "0,00" });
  renderEditor();
  var f = document.getElementById("e-name-" + id);
  if (f) { f.focus(); f.scrollIntoView({ block: "center" }); }
});
$("ecancel").addEventListener("click", closeEditor);
$("eback").addEventListener("click", function (e) { if (e.target === $("eback")) closeEditor(); });
$("edit-open").addEventListener("click", openEditor);

document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if (!$("eback").hidden) closeEditor();
  else if (!$("back").hidden) closeSheet();
});

function buildDoc(products, pix) {
  var reset = document.head.querySelector("style");
  var data = JSON.stringify({ products: products, pix: pix }).replace(/</g, "\\u003c");
  return "<!doctype html><html><head><meta charset=utf8>" +
    '<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">' +
    "<style>" + (reset ? reset.textContent : "") + "</style></head><body>" +
    HEAD_BITS +
    '<style id="css">' + document.getElementById("css").textContent + "</style>" +
    '<div id="root"></div>' +
    '<script type="application/json" id="data">' + data + "<\/script>" +
    LIB_TAG +
    '<script id="app">' + document.getElementById("app").textContent + "<\/script>" +
    "</body></html>";
}

$("esave").addEventListener("click", async function () {
  var msg = $("emsg");
  var out = [];
  for (var i = 0; i < draft.length; i++) {
    var d = draft[i];
    var name = d.name.trim();
    if (!name && !d.desc.trim()) continue;
    if (!name) { msg.textContent = "Dê um nome a todos os produtos."; return; }
    var cents = textToCents(d.price);
    if (isNaN(cents)) { msg.textContent = "O preço de “" + name + "” não é válido. Use um valor como 12,50."; return; }
    var item = { id: d.id, cat: d.cat.trim() || "Geral", name: name, desc: d.desc.trim(), price: cents };
    if (d.img) item.img = d.img;
    out.push(item);
  }
  if (out.length === 0) { msg.textContent = "Adicione pelo menos um produto."; return; }
  if (JSON.stringify(out).length > 9000000) { msg.textContent = "As fotos deixaram a página pesada demais. Remova algumas fotos e tente de novo."; return; }
  var pix = { key: normKey($("e-pix-key").value), name: $("e-pix-name").value.trim(), city: $("e-pix-city").value.trim() };
  if ((pix.key || pix.name || pix.city) && !(pix.key && pix.name && pix.city)) {
    msg.textContent = "Para usar o Pix, preencha a chave, o nome do recebedor e a cidade.";
    return;
  }
  if (!artifactApi) { msg.textContent = "Você não tem permissão para editar esta página."; return; }
  msg.textContent = "";
  var btn = $("esave");
  btn.disabled = true;
  btn.textContent = "Publicando…";
  try {
    await artifactApi.publish(buildDoc(out, pix));
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Publicar alterações";
    var code = err && err.code;
    if (code === "conflict") msg.textContent = "Outra pessoa publicou antes. A página vai recarregar com a versão mais nova.";
    else if (code === "not_granted" || code === "not_writer") msg.textContent = "Você não tem permissão para editar esta página.";
    else msg.textContent = "Não foi possível publicar. Tente de novo.";
  }
});

renderChips();
renderGrid();
renderTotals();

(async function () {
  try {
    if (!window.claude || !window.claude.use) return;
    var art = await window.claude.use("artifact");
    var user = await window.claude.use("user");
    if (art && user && user.canEdit()) {
      artifactApi = art;
      $("edit-open").hidden = false;
    }
  } catch (e) { /* o catálogo funciona sem o editor */ }
})();
